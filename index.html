<!DOCTYPE html>
<html lang="en">
  <head>
    <title>商品包篩選系統 | 網界網路科技</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.css"
    />

    <style>
      :root {
        --aside-width: 240px;
        --page-top: 56px;
      }

      header {
        background-color: #2bb9dd;
      }

      .brand {
        width: var(--aside-width);
        background-color: #2bb9dd;
      }

      .aside-content {
        top: 0;
        width: var(--aside-width);
        height: 100%;
        margin-top: var(--page-top);
      }

      .main-content {
        margin: var(--page-top) 0 0 var(--aside-width);
      }
    </style>
  </head>

  <body>
    <header class="fixed-top d-flex justify-content-between">
      <a
        class="brand text-decoration-none text-white text-center fs-3 p-2"
        href="#"
        >網界網路科技</a
      >
      <div class="nav-item d-flex">
        <a class="text-decoration-none text-white p-3">歡迎使用</a>
      </div>
    </header>

    <aside class="aside-content bg-light border-end position-fixed">
      <ul class="list-unstyled">
        <li>
          <a class="text-decoration-none d-block mt-3 px-3 py-2" href="#"
            ><i class="bi bi-file-earmark me-2"></i>商品列表</a
          >
        </li>
      </ul>
    </aside>

    <main class="main-content p-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2>商品篩選系統</h2>
        <!-- <button type="button" class="btn btn-primary">新增商品</button> -->
        <h4>商品組合計算器</h4>
        <label for="targetPrice">輸入總價：</label>
        <input type="number" id="targetPrice" placeholder="請輸入總價" />
        <button type="button" class="btn btn-primary" id="calculateBtn">篩選商品</button>
      </div>
      <div>
        <h4>符合的商品組合：</h4>
        <div id="result"></div>
      </div>

      <table id="productTable" class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>商品品項</th>
            <th>價格</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- Example rows -->
          <!-- <tr>
          <td>露營燈</td>
          <td>$500</td>
        </tr>
        <tr>
          <td>野餐墊</td>
          <td>$300</td>
        </tr> -->
        </tbody>
      </table>
    </main>

    <!-- Bootstrap JS and dependencies -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <!-- <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.0.3/js/dataTables.js"></script> -->

    <script src="./app.js"></script>
  </body>
</html>
